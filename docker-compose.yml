version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ulpf-postgres
    environment:
      POSTGRES_USER: ulpf_user
      POSTGRES_PASSWORD: ulpf_password
      POSTGRES_DB: ulpf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulpf_user -d ulpf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (Raw Log Preservation)
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: ulpf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulpf-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ulpf_user:ulpf_password@postgres:5432/ulpf_db
      - CORS_ORIGINS=*
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulpf-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
